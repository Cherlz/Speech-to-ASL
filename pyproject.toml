[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s2a"
version = "0.1.0"
description = "ASL gloss -> sign video poses -> stick-figure animation (plus a prototype text-to-gloss model)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch>=2.1",
    "tokenizers>=0.15",
    "sacrebleu>=2.3",
    "opencv-python-headless",
    "pillow",
    "mediapipe>=0.10.14",  # sign video -> body/hand landmarks
    "yt-dlp",  # WLASL videos hosted on YouTube
]

[project.optional-dependencies]
speech = ["openai-whisper"]
pose-format = ["pose-format"]
dev = ["pytest"]

[project.scripts]
s2a = "s2a.cli:main"

[tool.setuptools.packages.find]
include = ["s2a*"]

[tool.pytest.ini_options]
filterwarnings = ["ignore:enable_nested_tensor is True"]
